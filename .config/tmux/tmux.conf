source-file ~/.config/tmux/tmux.reset.conf
set-option -g default-terminal 'xterm-256color'
set-option -g terminal-overrides ',xterm-256color:RGB:Ss=\E[%p1%d q:Se=\E[0 q'
set -g xterm-keys on
set -g allow-passthrough on
set -g prefix ^A
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'xterm-256color:Smulx'
set -as terminal-features 'xterm-256color:Setulc'
set -g base-index 1
set -g detach-on-destroy off
set -s extended-keys on
set -s extended-keys-format csi-u
set -g history-limit 1000000
set -g renumber-windows on
set -g set-clipboard on
set -g status-position top
setw -g mode-keys vi
set -g mouse on
set -g pane-active-border-style 'fg=#f4b8e4,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'
set-window-option -g mode-style "fg=#f2d5cf,bg=#292c3c"
bind N new-session
bind d split-window -h -c "#{pane_current_path}"
bind D split-window -v -c "#{pane_current_path}"

# vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind -n C-M-h resize-pane -L 5
bind -n C-M-j resize-pane -D 2
bind -n C-M-k resize-pane -U 2
bind -n C-M-l resize-pane -R 5

set -g escape-time 0
set -g display-time 4000
set -g focus-events on

# Copy mode entry → block cursor
bind -T prefix [ set -g cursor-style block \; copy-mode
bind -T prefix PageUp set -g cursor-style block \; copy-mode -u
bind -T prefix Up set -g cursor-style block \; copy-mode -u
bind -n WheelUpPane set -g cursor-style block \; if-shell -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -e }
bind -n MouseDrag1Pane set -g cursor-style block \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -M }

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y set -g cursor-style bar \; send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Y set -g cursor-style bar \; send -X copy-pipe-and-cancel "tmux paste-buffer -p"
bind -T copy-mode-vi D set -g cursor-style bar \; send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter set -g cursor-style bar \; send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape set -g cursor-style bar \; send -X cancel
bind -T copy-mode-vi q set -g cursor-style bar \; send -X cancel
bind -T copy-mode-vi C-c set -g cursor-style bar \; send -X cancel
bind -T copy-mode MouseDragEnd1Pane set -g cursor-style bar \; send -X copy-pipe-and-cancel "pbcopy"


# ─── Catppuccin options (kept for reference) ───
set -g @sysstat_cpu_view_tmpl '#{cpu.pused}'
set -g @sysstat_mem_view_tmpl '#{mem.pused}'
set -g @tmux_wifi_icon_5 "󰤨 "
set -g @tmux_wifi_icon_4 "󰤥 "
set -g @tmux_wifi_icon_3 "󰤢 "
set -g @tmux_wifi_icon_2 "󰤟 "
set -g @tmux_wifi_icon_1 "󰤩 "
set -g @tmux_wifi_icon_off "󰤮 "
set -g @batt_icon_charge_tier1 "󰁺"
set -g @batt_icon_charge_tier2 "󰁻"
set -g @batt_icon_charge_tier3 "󰁼"
set -g @batt_icon_charge_tier4 "󰁽"
set -g @batt_icon_charge_tier5 "󰁾"
set -g @batt_icon_charge_tier6 "󰁿"
set -g @batt_icon_charge_tier7 "󰂀"
set -g @batt_icon_charge_tier8 "󰁹"
set -g @batt_icon_status_charged "󰚥"
set -g @batt_icon_status_charging "󰂄"
set -g @batt_icon_status_discharging "󰂃"
set -g @batt_icon_status_unknown "󰂑"
set -g status-interval 1

bind-key "s" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# ─── Inlined catppuccin-tmux formatting (was run-shell ~/.config/tmux/plugins/catppuccin-tmux/catppuccin.tmux) ───

set -g window-status-format "#[fg=#414559,bg=default,nobold,nounderscore,noitalics]#[fg=#c6d0f5,bg=#414559]#W#[fg=#f2d5cf,bg=#414559,nobold,nounderscore,noitalics] █#[fg=#414559,bg=#f2d5cf]#I#[fg=#f2d5cf,bg=default] "

set -g window-status-current-format "#[fg=#414559,bg=default,nobold,nounderscore,noitalics]#[fg=#c6d0f5,bg=#414559]#W 󰇈#{?window_zoomed_flag,}#[fg=#ef9090,bg=#414559,nobold,nounderscore,noitalics] █#[fg=#414559,bg=#ef9090]#I#[fg=#ef9090,bg=default] "

set -g status-left "#[fg=#f4b8e4,bg=default,nobold,nounderscore,noitalics] #[fg=#303446,bg=#f4b8e4,nobold,nounderscore,noitalics] #[fg=#303446,bg=#f4b8e4]#S#[fg=#f4b8e4,bg=default,nobold,nounderscore,noitalics] "

set -g status-right "#[fg=#f2d5cf,bg=default,nobold,nounderscore,noitalics] #[fg=#303446,bg=#f2d5cf,nobold,nounderscore,noitalics] #[fg=#303446,bg=#f2d5cf]#{b:pane_current_path}#[fg=#f2d5cf,bg=default,nobold,nounderscore,noitalics] #[fg=#ef9090,bg=default,nobold,nounderscore,noitalics] #[fg=#303446,bg=#ef9090,nobold,nounderscore,noitalics] #[fg=#303446,bg=#ef9090] #(/Users/raphael/.config/tmux/plugins/tmux-plugin-sysstat/scripts/cpu.sh) | #(/Users/raphael/.config/tmux/plugins/tmux-plugin-sysstat/scripts/mem.sh) | #(~/.config/tmux/plugins/tmux-cpu/scripts/cpu_temp.sh)#[fg=#ef9090,bg=default,nobold,nounderscore,noitalics] #[fg=#ca9ee6,bg=default,nobold,nounderscore,noitalics] #[fg=#303446,bg=#ca9ee6]#(~/.config/tmux/scripts/bluetooth.sh --module)#[fg=#ca9ee6,bg=default,nobold,nounderscore,noitalics] #[fg=#8caaee,bg=default,nobold,nounderscore,noitalics] #[fg=#303446,bg=#8caaee]#(/Users/raphael/.config/tmux/plugins/tmux-wifi/scripts/wifi_combined.sh)#[fg=#8caaee,bg=default,nobold,nounderscore,noitalics] #[fg=#e5c890,bg=default,nobold,nounderscore,noitalics] #[fg=#303446,bg=#e5c890,nobold,nounderscore,noitalics]#(/Users/raphael/.config/tmux/plugins/tmux-battery/scripts/battery_icon.sh) #[fg=#303446,bg=#e5c890]#(/Users/raphael/.config/tmux/plugins/tmux-battery/scripts/battery_percentage.sh)#[fg=#e5c890,bg=default,nobold,nounderscore,noitalics] #[fg=#eebebe,bg=default,nobold,nounderscore,noitalics] #[fg=#303446,bg=#eebebe,nobold,nounderscore,noitalics]󰃰 #[fg=#303446,bg=#eebebe]%H:%M#[fg=#eebebe,bg=default,nobold,nounderscore,noitalics] "

set -g window-status-style "fg=#c6d0f5,bg=default,none"
set -g window-status-current-style default
set -g window-status-separator ''
set -g display-panes-colour blue
set -g display-panes-active-colour red
set -g status-left-length 100
set -g status-right-length 100

# ─── Sysstat tmp dir for CPU collector (needed by cpu.sh) ───
run-shell 'sysstat_tmp=$(mktemp -d) && tmux set-option -g @sysstat_cpu_tmp_dir "$sysstat_tmp"'

# ─── Must be after formatting to avoid being overridden ───
set -g status 2
set -g status-format[1] ''

set -g status-style "bg=default"
set -g message-style "bg=default"
set -g message-command-style "bg=default"
set -g pane-border-style "bg=default"
set -g pane-active-border-style "bg=default"
set -g window-style "bg=default"
set -g window-active-style "bg=default"

set -g cursor-style bar

bind R command-prompt -I "#S" -p "Rename session: " "rename-session -- %1"

# ─── Instant status bar on startup ───
run-shell 'tmux refresh-client -S'

bind g display-popup -d "#{pane_current_path}" -w 95% -h 93% -E "lazygit"
bind b display-popup -d "#{~}" -w 60% -h 23% -E "btui"
bind y display-popup -d "#{pane_current_path}" -w 95% -h 93% -E "yazi"

# Enable undercurl support for Ghostty inside tmux
set -as terminal-overrides ',xterm-ghostty:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',xterm-ghostty:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
