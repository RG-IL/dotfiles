source-file ~/.config/tmux/tmux.reset.conf
set-option -g default-terminal 'xterm-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'
set -g xterm-keys on
set -g prefix ^A
set -as terminal-overrides ',xterm*:Tc:smkx=\E[?1h:rmkx=\E[?1l'
set -as terminal-features 'xterm*:extkeys'
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -s extended-keys always
set -s extended-keys-format csi-u
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
setw -g mode-keys vi
set -g mouse on
set -g pane-active-border-style 'fg=#f4b8e4,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'
bind N new-session                # Cmd+N from Ghostty sends prefix+N
bind d split-window -h -c "#{pane_current_path}"   # Cmd+D vertical split
bind D split-window -v -c "#{pane_current_path}"   # Cmd+Shift+D horizontal split

# vim-tmux-navigator: seamless Ctrl+hjkl between tmux panes and nvim splits
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Ctrl+Option+hjkl to resize panes
bind -n C-M-h resize-pane -L 5
bind -n C-M-j resize-pane -D 2
bind -n C-M-k resize-pane -U 2
bind -n C-M-l resize-pane -R 5

# tmux-sensible essentials
set -g escape-time 0
set -g display-time 4000
set -g focus-events on

# tmux-yank inline (system clipboard integration)
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Y send -X copy-pipe-and-cancel "tmux paste-buffer -p"
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi D send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# tmux-floax inline (floating scratch session)
set-environment -g FLOAX_WIDTH "80%"
set-environment -g FLOAX_HEIGHT "80%"
set-environment -g FLOAX_BORDER_COLOR "#f4b8e4"
set-environment -g FLOAX_TEXT_COLOR "blue"
set-environment -g FLOAX_CHANGE_PATH "true"
bind p run-shell "~/.config/tmux/plugins/tmux-floax/scripts/floax.sh"
bind P run-shell "~/.config/tmux/plugins/tmux-floax/scripts/menu.sh"

# ─── Catppuccin options ───

set -g @sysstat_cpu_view_tmpl '#{cpu.pused}'
set -g @sysstat_mem_view_tmpl '#{mem.pused}'
set -g @catppuccin_cpu_icon ""
set -g @catppuccin_flavour 'frappe'
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_color "#F4B8E4"
set -g @catppuccin_session_color "#f4b8e4"
set -g @catppuccin_directory_color "#f2d5cf"
set -g @catppuccin_cpu_color "#ef9090"
set -g @catppuccin_sys_icon ""
set -g @catppuccin_sys_color "#ef9090"
set -g @catppuccin_sys_text " #{sysstat_cpu} | #{sysstat_mem} | #(~/.config/tmux/plugins/tmux-cpu/scripts/cpu_temp.sh)"
set -g @catppuccin_battery_color "#e5c890"
set -g @catppuccin_date_time_color "#eebebe"
set -g @catppuccin_window_current_text "#W 󰇈#{?window_zoomed_flag,}"
set -g @catppuccin_bluetooth_color "#ca9ee6"
set -g @catppuccin_status_modules_right "directory sys bluetooth wifi battery date_time"

set -g @tmux_wifi_icon_5 "󰤨 "
set -g @tmux_wifi_icon_4 "󰤥 "
set -g @tmux_wifi_icon_3 "󰤢 "
set -g @tmux_wifi_icon_2 "󰤟 "
set -g @tmux_wifi_icon_1 "󰤩 "
set -g @tmux_wifi_icon_off "󰤮 "

set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "all"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_status_background "default"
set -g @catppuccin_directory_text "#{b:pane_current_path}"
set -g @catppuccin_date_time_text "%H:%M"
set -g status-interval 2

bind-key "s" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# ─── Plugins sourced directly (no TPM, saves ~0.5s startup) ───

run-shell ~/.config/tmux/plugins/catppuccin-tmux/catppuccin.tmux
run-shell ~/.config/tmux/plugins/tmux-battery/battery.tmux
run-shell ~/.config/tmux/plugins/tmux-plugin-sysstat/sysstat.tmux
run-shell ~/.config/tmux/plugins/tmux-wifi/tmux-wifi.tmux

# Must be after plugins to avoid being overridden
set -g status 2
set -g status-format[1] ''

set -g status-style "bg=default"
set -g message-style "bg=default"
set -g message-command-style "bg=default"
set -g pane-border-style "bg=default"
set -g pane-active-border-style "bg=default"
set -g window-style "bg=default"
set -g window-active-style "bg=default"

set -g cursor-style bar

# Cmd+Shift+R renames the current session (Ghostty sends prefix+R)
bind R command-prompt -I "#S" -p "Rename session: " "rename-session -- %1"

bind g display-popup -d "#{pane_current_path}" -w 95% -h 93% -E "lazygit"
bind b display-popup -d "#{~}" -w 60% -h 23% -E "btui"


