[mgr]
ratio = [1, 4, 5]
sort_by = "size"
sort_reverse = true
sort_dir_first = true
linemode = "size"

[preview]
max_width = 2400
max_height = 3600
image_quality = 90

[opener]
edit = [
    { run = 'nvim "$@"', desc = "nvim", block = true, for = "unix" },
]
open = [
    { run = 'open "$@"', desc = "Open", for = "macos" },
]

[open]
rules = [
    { mime = "inode/directory", use = ["open"] },
    { mime = "text/*", use = ["edit"] },
    { name = "*.cs", mime = "*", use = ["edit"] },
    { mime = "*", use = ["open"] },
]

[[plugin.prepend_fetchers]]
id    = "git" # Remove if Yazi > v26.1.22
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
id    = "git" # Remove if Yazi > v26.1.22
url   = "*/"
run   = "git"
group = "git"
