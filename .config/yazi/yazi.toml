[mgr]
ratio = [1, 4, 5]
sort_by = "size"
sort_reverse = true
sort_dir_first = true
linemode = "size"
show_hidden = false

[preview]
max_width = 2400
max_height = 3600
image_quality = 90

[opener]
edit = [
    { run = '/usr/bin/env -u NVIM_APPNAME -u XDG_CONFIG_HOME -u XDG_DATA_HOME -u XDG_STATE_HOME -u XDG_CACHE_HOME nvim -u /Users/raphael/.config/nvim/init.lua %s', desc = "nvim", block = true, for = "unix" },
]
open = [
    { run = 'open %s', desc = "Open", for = "macos" },
]
play = [
    { run = 'open -a "QuickTime Player" %s', desc = "play", for = "unix" },
]

[open]
prepend_rules = [
{url = "*.mp4", use = ["play", "open"]},
{url = "*.mkv", use = ["play", "open"]},
{ url = "*.avi", use = ["play", "open"] },
{ url = "*.mov", use = ["play", "open"] },
{ url = "*.webm", use = ["play", "open"] },
{ url = "*.ogg", use = ["play", "open"] },
{ url = "*.ogv", use = ["play", "open"] },
{ url = "*.mpg", use = ["play", "open"] },
{ url = "*.mpeg", use = ["play", "open"] },
{ url = "*.mp3", use = ["play", "open"] },
{ url = "*.flac", use = ["play", "open"] },
{ url = "*.wav", use = ["play", "open"] },
{ url = "*.m4a", use = ["play", "open"] },
{ url = "*.aiff", use = ["play", "open"] },
{ url = "*.wma", use = ["play", "open"] },
{url = "*", use = ["edit", "open"]},
]

[[plugin.prepend_fetchers]]
id    = "git" # Remove if Yazi > v26.1.22
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
id    = "git" # Remove if Yazi > v26.1.22
url   = "*/"
run   = "git"
group = "git"
